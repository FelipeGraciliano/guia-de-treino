<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Treino — Hipertrofia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#09090b;
    --card:rgba(26, 26, 29, 0.65);
    --card2:rgba(33, 33, 37, 0.75);
    --line:rgba(255, 255, 255, 0.08);
    --ink:#f8fafc;
    --ink-dim:#94a3b8;
    --ink-faint:#64748b;

    --seg:#ef4444; --seg-bg:rgba(239, 68, 68, 0.15);
    --ter:#3b82f6; --ter-bg:rgba(59, 130, 246, 0.15);
    --qua:#22c55e; --qua-bg:rgba(34, 197, 94, 0.15);
    --qui:#eab308; --qui-bg:rgba(234, 179, 8, 0.15);
    --sex:#a855f7; --sex-bg:rgba(168, 85, 247, 0.15);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif;}
  body{padding-bottom:48px;}

  header{padding:26px 20px 14px; text-align:center; border-bottom:1px solid var(--line);}
  .eyebrow{font-size:12px; letter-spacing:.14em; color:var(--ink-faint); text-transform:uppercase; margin:0 0 6px;}
  h1{font-family:'Bebas Neue',sans-serif; font-size:36px; letter-spacing:.03em; margin:0; line-height:1;}
  .sub{font-size:13px; color:var(--ink-dim); margin:8px 0 0;}

  .plan-switch{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:14px 16px 0;
  }
  .plan-btn{
    flex:1 1 100px;
    text-align:left;
    padding:12px 14px;
    border-radius:16px;
    border:1px solid var(--line);
    background:var(--card);
    cursor:pointer;
    font-family:'Inter',sans-serif;
    transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s, background 0.2s;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .plan-btn:active { transform: scale(0.97); }
  .plan-btn.active{border-color:var(--ink);}
  .plan-btn.highlight{border-color:#e0ab2f; border-style:dashed;}
  .plan-btn.highlight.active{border-style:solid;}
  .plan-btn.recommended{border-color:#4fa65b; border-width:1.5px;}
  .plan-btn.recommended.active{background:#122117;}
  .plan-btn .pname{
    font-family:'Bebas Neue',sans-serif;
    font-size:16px;
    letter-spacing:.02em;
    color:var(--ink);
    display:block;
  }
  .plan-btn .pdesc{
    font-size:10.5px;
    color:var(--ink-faint);
    display:block;
    margin-top:2px;
    line-height:1.3;
  }

  nav.days{
    display:flex; overflow-x:auto; gap:10px;
    padding:14px 16px;
    position:sticky; top:0; background:rgba(9, 9, 11, 0.85); z-index:10;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-bottom:1px solid var(--line);
    scrollbar-width:none;
  }
  nav.days::-webkit-scrollbar{display:none;}
  .day-btn{
    flex:0 0 auto;
    font-family:'Bebas Neue',sans-serif;
    font-size:18px; letter-spacing:.04em;
    padding:9px 18px;
    border-radius:24px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-dim);
    cursor:pointer;
    transition: all 0.2s ease;
  }
  .day-btn .dot{
    display:inline-block; width:8px; height:8px; border-radius:50%;
    margin-right:7px; vertical-align:middle; position:relative; top:-1px;
  }
  .day-btn.active{color:var(--ink); border-color:transparent;}
  .day-btn[data-day="seg"].active{background:var(--seg-bg); box-shadow:inset 0 0 0 1px var(--seg);}
  .day-btn[data-day="ter"].active{background:var(--ter-bg); box-shadow:inset 0 0 0 1px var(--ter);}
  .day-btn[data-day="qua"].active{background:var(--qua-bg); box-shadow:inset 0 0 0 1px var(--qua);}
  .day-btn[data-day="qui"].active{background:var(--qui-bg); box-shadow:inset 0 0 0 1px var(--qui);}
  .day-btn[data-day="sex"].active{background:var(--sex-bg); box-shadow:inset 0 0 0 1px var(--sex);}
  .today-tag{
    display:inline-block;
    margin-left:6px;
    font-family:'Inter',sans-serif;
    font-size:9px;
    letter-spacing:.06em;
    text-transform:uppercase;
    font-weight:700;
    color:var(--bg);
    background:var(--ink);
    padding:2px 6px;
    border-radius:8px;
    vertical-align:middle;
  }

  main{padding:18px 16px 8px;}
  .day-panel{display:none;}
  .day-panel.active{display:block;}
  .plan-panel{display:none;}
  .plan-panel.active{display:block;}

  .day-title{padding:2px 2px 16px;}
  .day-title h2{font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:.03em; margin:0 0 3px;}
  .day-title p{margin:0; font-size:12.5px; color:var(--ink-dim);}

  .progress-wrap{display:flex; align-items:center; gap:10px; margin-bottom:20px;}
  .progress-track{flex:1; height:5px; border-radius:3px; background:var(--line); overflow:hidden;}
  .progress-fill{height:100%; width:0%; border-radius:3px; transition:width .25s ease;}
  .progress-label{font-size:11px; color:var(--ink-faint); white-space:nowrap; font-variant-numeric:tabular-nums;}

  .group{margin-bottom:22px;}
  .group-head{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:0 2px 10px; border-bottom:1px solid var(--line); margin-bottom:12px;
  }
  .group-head h3{font-size:13px; letter-spacing:.08em; text-transform:uppercase; font-weight:600; margin:0;}
  .group-head span{font-size:11px; color:var(--ink-faint);}

  .ex-card{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:16px; margin-bottom:12px; box-shadow:0 8px 24px rgba(0,0,0,0.15); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);}
  .ex-card.done{opacity:.55; transform:scale(0.98); transition:all 0.3s ease;}
  .ex-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px;}
  .ex-name{font-size:16px; font-weight:600; line-height:1.3; margin:0 0 4px; letter-spacing:-0.01em;}
  .ex-target{font-size:12px; color:var(--ink-dim); margin:0; line-height:1.4;}
  .ex-scheme{font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:.03em; white-space:nowrap; padding-top:2px; color:var(--ink);}

  .sets-row{display:flex; gap:8px; margin-top:14px;}
  .set-dot{
    flex:1; height:34px; border-radius:10px; border:1px solid var(--line);
    background:var(--card2); color:var(--ink-faint); font-size:13px; font-weight:600;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s, color 0.2s;
  }
  .set-dot:active { transform: scale(0.85); }
  .set-dot.checked{color:var(--bg); border-color:transparent; transform: scale(1.05);}

  body[data-active="seg"] .set-dot.checked{background:var(--seg);}
  body[data-active="ter"] .set-dot.checked{background:var(--ter);}
  body[data-active="qua"] .set-dot.checked{background:var(--qua);}
  body[data-active="qui"] .set-dot.checked{background:var(--qui);}
  body[data-active="sex"] .set-dot.checked{background:var(--sex);}
  body[data-active="seg"] .progress-fill{background:var(--seg);}
  body[data-active="ter"] .progress-fill{background:var(--ter);}
  body[data-active="qua"] .progress-fill{background:var(--qua);}
  body[data-active="qui"] .progress-fill{background:var(--qui);}
  body[data-active="sex"] .progress-fill{background:var(--sex);}

  .ex-swap{
    margin-top:10px; display:flex; align-items:center; gap:6px;
    font-size:12px; color:var(--ink-faint); background:none; border:none; padding:0;
    cursor:pointer; font-family:'Inter',sans-serif;
  }
  .ex-swap svg{width:13px; height:13px; flex:0 0 auto;}
  .ex-swap:active{color:var(--ink-dim);}
  .alt-row{display:none; margin-top:8px; padding:8px; background:var(--card2); border-radius:9px;}
  .alt-row.open{display:block;}
  .variant-pick{
    display:flex;
    align-items:flex-start;
    gap:8px;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    border-radius:7px;
    padding:8px 7px;
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    color:var(--ink-dim);
    cursor:pointer;
  }
  .variant-pick + .variant-pick{ margin-top:2px; }
  .variant-pick.picked{ background:var(--card); color:var(--ink); }
  .vp-check{ flex:0 0 auto; font-size:13px; line-height:1.4; }
  .vp-label{ line-height:1.4; }
  .variant-pick.picked .vp-check{ color:var(--ink); }

  .note{
    font-size:12.5px; color:var(--ink-dim); background:var(--card); border:1px solid var(--line);
    border-radius:10px; padding:11px 13px; margin-bottom:16px; line-height:1.5;
  }

  .split-bar{
    display:flex; height:8px; border-radius:4px; overflow:hidden; margin-bottom:8px;
  }
  .split-bar div{height:100%;}
  .split-legend{display:flex; flex-wrap:wrap; gap:10px; font-size:11px; color:var(--ink-dim);}
  .split-legend span{display:flex; align-items:center; gap:5px;}
  .split-legend i{width:8px; height:8px; border-radius:50%; display:inline-block;}

  .reset-btn{
    display:block; width:100%; margin-top:6px; padding:12px; background:transparent;
    border:1px solid var(--line); border-radius:12px; color:var(--ink-faint); font-size:13px;
    font-family:'Inter',sans-serif; cursor:pointer;
  }
  .reset-btn:active{background:var(--card);}
  .ex-tip{
    margin-top:9px;
    padding:9px 11px;
    background:var(--card2);
    border-radius:9px;
    font-size:12px;
    color:var(--ink-dim);
    line-height:1.5;
  }
  .ex-tip b{color:var(--ink); font-weight:600;}
  .save-toast{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--card2);
    border:1px solid var(--line);
    color:var(--ink-dim);
    font-size:12px;
    padding:9px 16px;
    border-radius:20px;
    opacity:0;
    transition:opacity .2s, transform .2s;
    pointer-events:none;
    z-index:50;
  }
  .save-toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .summary-btn{
    display:block;
    width:calc(100% - 32px);
    margin:10px 16px 0;
    padding:11px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--ink-dim);
    font-size:12.5px;
    font-family:'Inter',sans-serif;
    cursor:pointer;
  }
  .summary-btn:active{background:var(--card2);}
  .summary-panel{
    display:none;
    margin:10px 16px 0;
    padding:14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
  }
  .summary-panel.open{display:block;}
  .summary-panel h4{
    font-family:'Bebas Neue',sans-serif;
    font-size:16px;
    letter-spacing:.02em;
    margin:0 0 10px;
    font-weight:400;
  }
  .summary-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:8px;
  }
  .summary-row .sname{
    width:88px;
    flex:0 0 auto;
    font-size:12px;
    color:var(--ink-dim);
  }
  .summary-row .sbar-track{
    flex:1;
    height:8px;
    background:var(--card2);
    border-radius:4px;
    overflow:hidden;
  }
  .summary-row .sbar-fill{
    height:100%;
    border-radius:4px;
    background:var(--ink-faint);
  }
  .howto-links{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .howto-link{
    display:inline-flex;
    align-items:center;
    gap:5px;
    margin-top:8px;
    font-size:11.5px;
    color:var(--ink-faint);
    text-decoration:none;
    border:1px solid var(--line);
    border-radius:7px;
    padding:5px 9px;
  }
  .howto-link:active{background:var(--card2);}
  .howto-link svg{width:11px; height:11px; flex:0 0 auto;}
  .alt-row a.howto-link{margin-top:4px; margin-left:0;}

.library-note{margin:0 auto 14px;max-width:980px;padding:12px 14px;border:1px solid rgba(127,127,127,.25);border-radius:14px;background:rgba(127,127,127,.07);display:flex;gap:10px;align-items:flex-start;flex-direction:column}.library-note b{font-size:14px}.library-note span{font-size:12px;opacity:.78}.cat-filter{max-width:980px;margin:0 auto 10px;display:flex;gap:6px;flex-wrap:wrap;padding:0 10px}.cat-btn{padding:7px 11px;border-radius:20px;border:1px solid #3a3a40;background:var(--card);color:var(--ink-dim);font-size:11.5px;cursor:pointer;opacity:1;white-space:nowrap}.cat-btn:hover{border-color:#6b6b72;color:var(--ink)}.cat-btn.active{color:var(--ink);background:var(--card2);border-color:var(--ink);font-weight:700;box-shadow:0 0 0 1px rgba(242,240,234,.08)}.strategy-panel{max-width:980px;margin:0 auto 14px;display:none;padding:14px;border:1px solid rgba(127,127,127,.25);border-radius:14px;background:rgba(127,127,127,.06)}.strategy-panel.show{display:block}.strategy-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.strategy-title{font-weight:800;font-size:18px}.strategy-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.strategy-item{padding:9px 10px;border-radius:10px;background:rgba(127,127,127,.08);font-size:12px}.strategy-item b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;opacity:.62;margin-bottom:3px}@media(max-width:600px){.strategy-grid{grid-template-columns:1fr}.library-note{margin-left:10px;margin-right:10px}}

.library-tools{max-width:980px;margin:0 auto 10px;padding:0 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.plan-search{flex:1;min-width:220px;padding:9px 11px;border:1px solid rgba(127,127,127,.3);border-radius:10px;background:transparent;color:inherit;font:inherit;font-size:12px}.tool-btn{margin:0!important;width:auto!important}.comparison-panel{max-width:980px;margin:0 auto 14px;padding:12px 14px;border:1px solid rgba(127,127,127,.25);border-radius:14px;background:rgba(127,127,127,.06);display:none}.comparison-panel.open{display:block}.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.compare-grid select{width:100%;padding:8px;border-radius:9px;border:1px solid rgba(127,127,127,.3);background:transparent;color:inherit}.compare-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:11px}.compare-table th,.compare-table td{padding:7px;border-bottom:1px solid rgba(127,127,127,.18);text-align:left;vertical-align:top}.compare-table th{font-size:10px;opacity:.7;text-transform:uppercase}@media(max-width:600px){.compare-grid{grid-template-columns:1fr}.library-tools{align-items:stretch}.plan-search{min-width:0;width:100%}.tool-btn{width:100%!important}}
/* ===== Clareza da divisão: nome da divisão, músculos e distribuição semanal ===== */
.plan-btn .pdiv{display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; margin-top:6px; font-size:9.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-dim); line-height:1.3;}
.div-card{margin-top:12px; padding:13px 14px; border:1px solid var(--line); border-left:4px solid var(--ink); border-radius:12px; background:var(--card); color:var(--ink);}
.dc-eyebrow,.wd-title{font-size:10.5px; letter-spacing:.12em; font-weight:700; color:var(--ink-faint); text-transform:uppercase;}
.dc-name{font-family:'Bebas Neue',sans-serif; font-size:26px; line-height:1.12; letter-spacing:.03em; text-transform:uppercase; margin:4px 0 12px; color:var(--ink); overflow-wrap:break-word;}
.dc-name span{display:inline-block; max-width:100%; margin-right:.3em;}
.dc-name i{font-style:normal; color:var(--ink-faint); margin-left:.25em;}
.dc-block + .dc-block{margin-top:10px;}
.dc-block b{display:block; font-size:10px; letter-spacing:.1em; color:var(--ink-faint); margin-bottom:3px;}
.dc-block span{display:block; font-size:13px; line-height:1.5; color:var(--ink);}
.week-dist{margin-top:14px;}
.wd-title{margin-bottom:7px;}
.wd-title span{font-weight:500; letter-spacing:.04em; text-transform:none; opacity:.85;}
.week-row{display:flex; align-items:center; gap:10px; width:100%; margin:0 0 6px; padding:9px 11px; text-align:left; font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-left:4px solid var(--dc, var(--line)); border-radius:10px; cursor:pointer; -webkit-appearance:none; appearance:none;}
.week-row.rest{cursor:default; background:transparent; border-style:dashed; border-left-style:dashed; border-left-color:var(--line); opacity:.7;}
.wr-day{flex:0 0 72px; font-family:'Bebas Neue',sans-serif; font-size:17px; letter-spacing:.04em; line-height:1.2; color:var(--ink-dim);}
.wr-main{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px;}
.wr-div{font-size:13px; font-weight:700; line-height:1.3; color:var(--ink);}
.wr-mus{font-size:12px; line-height:1.4; color:var(--ink-dim);}
.wr-go{flex:0 0 auto; font-size:18px; line-height:1; color:var(--ink-faint);}
body[data-active="seg"] .week-row[data-day="seg"],
body[data-active="ter"] .week-row[data-day="ter"],
body[data-active="qua"] .week-row[data-day="qua"],
body[data-active="qui"] .week-row[data-day="qui"],
body[data-active="sex"] .week-row[data-day="sex"]{background:var(--card2); box-shadow:0 0 0 1px var(--ink-faint);}
.day-division{margin:0 0 14px; padding:10px 12px; border:1px solid var(--line); border-left:4px solid var(--dc, var(--ink)); border-radius:10px; background:var(--card);}
.dd-row{display:flex; gap:10px; align-items:baseline;}
.dd-row + .dd-row{margin-top:5px;}
.dd-row b{flex:0 0 78px; font-size:10px; letter-spacing:.1em; color:var(--ink-faint);}
.dd-row span{flex:1 1 auto; min-width:0; font-size:12.5px; line-height:1.4; color:var(--ink-dim);}
.dd-row span.dd-div{font-size:13.5px; font-weight:700; color:var(--ink);}
@media(max-width:600px){ .dc-name{font-size:23px;} }
.compare-table th,.compare-table td{overflow-wrap:anywhere;}

/* Fase 2 — registro de carga/reps */
.set-log{display:grid;grid-template-columns:34px minmax(70px,1fr) minmax(70px,1fr);gap:6px;align-items:center;margin-top:7px;}
.set-log-head{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);text-align:center;}
.set-log input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:8px;padding:7px 6px;font:inherit;font-size:12px;text-align:center;outline:none;}
.set-log input:focus{border-color:var(--ink-faint);}
.set-log .set-num{font-size:11px;color:var(--ink-dim);text-align:center;}
.history-btn{margin:10px 0 0;width:100%;}
.history-panel{display:none;margin:10px 0 18px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card2);}
.history-panel.show{display:block;}
.history-title{font-weight:800;margin-bottom:8px;}
.history-empty{font-size:12px;color:var(--ink-dim);}
.history-item{padding:9px 0;border-top:1px solid var(--line);font-size:12px;}
.history-item:first-child{border-top:0;}
.history-item b{display:block;margin-bottom:3px;}
.history-item span{color:var(--ink-dim);}
@media(max-width:600px){.set-log{grid-template-columns:28px minmax(62px,1fr) minmax(62px,1fr);gap:5px}.set-log input{padding:7px 4px}}

/* ===== Fase 3 — visão de progresso + backup ===== */
.progress-panel{max-width:980px;margin:0 auto 14px;padding:14px;border:1px solid rgba(127,127,127,.25);border-radius:14px;background:rgba(127,127,127,.06);display:none;}
.progress-panel.open{display:block;}
.progress-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.progress-title{font-size:18px;font-weight:800;}
.progress-sub{font-size:11px;color:var(--ink-dim);margin-top:3px;}
.progress-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
.progress-action{width:auto!important;margin:0!important;padding:7px 10px!important;font-size:11px!important;}
.progress-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px;}
.progress-stat{padding:10px;border:1px solid var(--line);border-radius:11px;background:var(--card);}
.progress-stat b{display:block;font-size:20px;line-height:1.1;}
.progress-stat span{display:block;margin-top:4px;font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint);}
.progress-section{margin-top:14px;}
.progress-section h4{margin:0 0 8px;font-size:12px;}
.progress-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;align-items:end;}
.progress-day{min-width:0;text-align:center;}
.progress-day-bar{height:74px;border:1px solid var(--line);border-radius:8px;background:var(--card);display:flex;align-items:flex-end;padding:3px;box-sizing:border-box;}
.progress-day-fill{width:100%;min-height:3px;border-radius:5px;background:var(--ink);opacity:.8;}
.progress-day-label{font-size:9px;color:var(--ink-faint);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.progress-day-count{font-size:9px;color:var(--ink-dim);margin-top:2px;}
.progress-recent{display:grid;gap:6px;}
.progress-recent-item{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:11px;}
.progress-recent-item b{display:block;margin-bottom:3px;}
.progress-recent-item span{color:var(--ink-dim);}
.progress-note{font-size:10px;color:var(--ink-faint);line-height:1.45;margin-top:10px;}
@media(max-width:600px){.progress-stats{grid-template-columns:repeat(2,minmax(0,1fr));}.progress-days{gap:3px}.progress-day-bar{height:62px}.progress-title{font-size:16px}.progress-actions{display:grid;grid-template-columns:1fr 1fr}.progress-action{width:100%!important;box-sizing:border-box;}}
.adv-tag{display:inline-block; margin-left:6px; padding:3px 6px; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; border-radius:5px; background:rgba(224, 71, 46, 0.15); color:#e2472e; vertical-align:middle;}
html.light-mode{
  --bg:#f8fafc;
  --card:rgba(255, 255, 255, 0.85);
  --card2:rgba(241, 245, 249, 0.9);
  --line:rgba(0, 0, 0, 0.1);
  --ink:#0f172a;
  --ink-dim:#475569;
  --ink-faint:#64748b;
  --seg-bg:rgba(239, 68, 68, 0.15);

  --sex-bg:rgba(168, 85, 247, 0.15);
}
.theme-toggle{position:absolute; top:24px; right:20px; background:transparent; border:none; color:var(--ink-dim); font-size:22px; cursor:pointer;}

function applyDivisionInfo(){
  const seenNames = (arr) => { const s = new Set(); return arr.filter(d => { if(s.has(d.division)) return false; s.add(d.division); return true; }); };
  Object.keys(PLANS).forEach(planKey => {
    const p = PLANS[planKey];
    const info = DIVISION_INFO[planKey] || {};
    if(info.days){
      Object.keys(info.days).forEach(dayKey => {
        if(p.days[dayKey]){ p.days[dayKey].division = info.days[dayKey][0]; p.days[dayKey].muscles = info.days[dayKey][1]; }
      });
    }
    const days = Object.values(p.days);
    days.forEach(d => { if(!d.division || !d.muscles) console.warn("Dia sem divisão/músculos:", planKey, d.label); });
    const withDiv = days.filter(d => d.division);
    const byName = seenNames(withDiv);
    const flowSeen = new Set();
    const flow = withDiv.filter(d => { const k = d.division + "|" + d.muscles; if(flowSeen.has(k)) return false; flowSeen.add(k); return true; });
    p.division = info.division || byName.map(d => d.division).join(" / ");
    p.divisionMuscles = info.muscles || flow.map(d => d.muscles).join(" → ");
    p.divisionDescription = info.description || "";
    if(!p.divisionDescription) console.warn("Plano sem descrição da divisão:", planKey);
  });
}

// Textos de busca: tudo em minúsculas, sem acento e com "+" colado ("Chest + Back" = "chest+back")
function normSearch(s){
  return String(s == null ? "" : s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s*\+\s*/g, "+").replace(/\s+/g, " ").trim();
}

const WEEK_ORDER = ["seg","ter","qua","qui","sex"];
const WEEK_NAME = { seg:"Segunda", ter:"Terça", qua:"Quarta", qui:"Quinta", sex:"Sexta" };

function renderDivisionCard(p){
  if(!p.division) return "";
  const parts = p.division.split(" / ");
  const name = parts.map((s, i) => `<span>${s}${i < parts.length - 1 ? "<i>/</i>" : ""}</span>`).join(" ");
  return `<div class="div-card">
    <div class="dc-eyebrow">🏋️ Divisão</div>
    <div class="dc-name">${name}</div>
    ${p.divisionMuscles ? `<div class="dc-block"><b>O QUE É TREINADO</b><span>${p.divisionMuscles}</span></div>` : ""}
    ${p.divisionDescription ? `<div class="dc-block"><b>DESCRIÇÃO</b><span>${p.divisionDescription}</span></div>` : ""}
  </div>`;
}

function renderWeekDistribution(planKey){
  const days = PLANS[planKey].days;
  const keys = Object.keys(days);
  if(!keys.length || !keys.every(k => days[k].division)) return "";
  const dayRow = (k) => {
    const d = days[k];
    return `<button type="button" class="week-row" data-day="${k}" style="--dc:var(--${d.color})">
      <span class="wr-day">${d.label}</span>
      <span class="wr-main"><b class="wr-div">${d.division}</b><span class="wr-mus">${d.muscles}</span></span>
      <span class="wr-go">›</span>
    </button>`;
  };
  const restRow = (name) => `<div class="week-row rest"><span class="wr-day">${name}</span><span class="wr-main"><b class="wr-div">Descanso</b><span class="wr-mus">—</span></span></div>`;
  let rows = [];
  // Se os dias são dias da semana de verdade, mostra também os dias de descanso entre o primeiro e o último treino.
  const weekdayPlan = keys.every(k => days[k].label === WEEK_NAME[k]);
  if(weekdayPlan){
    const idx = keys.map(k => WEEK_ORDER.indexOf(k));
    for(let i = Math.min(...idx); i <= Math.max(...idx); i++){
      const k = WEEK_ORDER[i];
      rows.push(days[k] ? dayRow(k) : restRow(WEEK_NAME[k]));
    }
  } else {
    rows = keys.map(dayRow);
  }
  return `<div class="week-dist"><div class="wd-title">Distribuição semanal <span>· toque num dia para abrir</span></div>${rows.join("")}</div>`;
}

const STORAGE_KEY = "workout-progress";
const STORAGE_VERSION = 2;
let progress = { version: STORAGE_VERSION, checks: {}, selectedVariant: {}, experiment: {}, logs: {}, history: {}, lastPlan: null, lastDay: null };
let progressLoaded = false;

function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
}

function normalizeProgress(parsed){
  if(!parsed || typeof parsed !== "object") return null;
  return {
    version: parsed.version || 1,
    checks: parsed.checks || {},
    selectedVariant: parsed.selectedVariant || {},
    experiment: parsed.experiment || {},
    logs: parsed.logs || {},
    history: parsed.history || {},
    lastPlan: parsed.lastPlan || null,
    lastDay: parsed.lastDay || null
  };
}

function readLocalProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? normalizeProgress(JSON.parse(raw)) : null;
  }catch(e){
    console.warn("LocalStorage indisponível:", e);
    return null;
  }
}

function writeLocalProgress(payload){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    return true;
  }catch(e){
    console.warn("Não consegui salvar no LocalStorage:", e);
    return false;
  }
}

async function loadProgress(){
  let parsed = readLocalProgress();
  if(!parsed){
    try{
      if(window.storage && typeof window.storage.get === "function"){
        const result = await window.storage.get(STORAGE_KEY, false);
        if(result && result.value) parsed = normalizeProgress(JSON.parse(result.value));
      }
    }catch(e){
      console.warn("Armazenamento legado indisponível:", e);
    }
  }
  if(parsed){
    progress = parsed;
    // Migra dados antigos para o armazenamento padrão do navegador quando possível.
    writeLocalProgress(progress);
  }
  progressLoaded = true;
}

let saveTimer = null;
function saveProgress(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    const saved = writeLocalProgress(progress);
    if(!saved){
      try{
        if(window.storage && typeof window.storage.set === "function") await window.storage.set(STORAGE_KEY, JSON.stringify(progress), false);
      }catch(e){
        console.error("Não consegui salvar o progresso:", e);
      }
    }
    showToast(saved ? "💾 Salvo neste navegador" : "⚠️ Não foi possível salvar");
  }, 250);
}

function showToast(message="Salvo") {
  let toast = document.getElementById('saveToast');
  if(!toast){
    toast = document.createElement('div');
    toast.id = 'saveToast';
    toast.className = 'save-toast';
    document.body.appendChild(toast);
  }
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> toast.classList.remove('show'), 1500);
}

function exportProgress(){
  const payload = { app:"Treino 10 v3-2", version:STORAGE_VERSION, exportedAt:new Date().toISOString(), progress };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = "treino-backup-" + todayStr() + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast("📤 Backup exportado");
}

function importProgress(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = async ()=>{
    const file = input.files && input.files[0];
    if(!file) return;
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      const parsed = normalizeProgress(data.progress || data);
      if(!parsed) throw new Error("Formato inválido");
      if(!confirm("Importar este backup vai substituir o progresso atual neste aparelho. Continuar?")) return;
      progress = parsed;
      writeLocalProgress(progress);
      renderProgressPanel();
      renderPlanSwitch();
      renderNav(currentPlan);
      showToast("📥 Backup restaurado");
    }catch(e){
      console.error(e);
      showToast("⚠️ Backup inválido");
    }
  };
  input.click();
}

function saveSetLog(planKey, dayKey, gi, ei, si, field, value){
  const id=logId(planKey,dayKey,gi,ei,si);
  progress.logs[id]=progress.logs[id] || {weight:"",reps:""};
  progress.logs[id][field]=value;
  saveProgress();
}
function addHistoryEntry(planKey, dayKey, gi, ei, variantName){
  const ex=PLANS[planKey].days[dayKey].groups[gi].exercises[ei];
  const base=exId(planKey,dayKey,gi,ei);
  const sets=[];
  const count=setsCountFromScheme(ex.scheme);
  for(let si=0;si<count;si++){
    const log=getLog(planKey,dayKey,gi,ei,si);
    if(log.weight!=="" || log.reps!=="") sets.push({set:si+1,weight:log.weight,reps:log.reps,done:!!(progress.checks[base]?.sets?.[si])});
  }
  if(!sets.length) return;
  const key=base;
  progress.history[key]=progress.history[key] || [];
  const date=todayStr();
  const existing=progress.history[key].find(h=>h.date===date);
  const entry={date,exercise:variantName,sets};
  if(existing) Object.assign(existing,entry); else progress.history[key].unshift(entry);
  progress.history[key]=progress.history[key].slice(0,10);
}
function renderHistory(planKey,dayKey,gi,ei){
  const id=exId(planKey,dayKey,gi,ei);
  const list=progress.history[id] || [];
  if(!list.length) return '<div class="history-empty">Ainda não há histórico registrado para este exercício.</div>';
  return list.slice(0,5).map(h=>`<div class="history-item"><b>${h.date} · ${h.exercise}</b><span>${h.sets.map(x=>`S${x.set}: ${x.weight!==""?x.weight+' kg':'—'} × ${x.reps!==""?x.reps:'—'}${x.done?' ✓':''}`).join(' · ')}</span></div>`).join('');
}

function updateExCardStatus(card, totalSets, doneSets){
  card.classList.toggle('done', doneSets === totalSets);
}
function updateProgress(planKey, dayKey){
  const panel = document.getElementById('panel-'+planKey+'-'+dayKey);
  if(!panel) return;
  let total = 0, done = 0;
  panel.querySelectorAll('.set-dot').forEach(dot=>{
    total++;
    if(dot.classList.contains('checked')) done++;
  });
  const pct = total ? Math.round((done/total)*100) : 0;
  panel.querySelector('.progress-fill').style.width = pct + '%';
  panel.querySelector('.progress-label').textContent = done + '/' + total + ' séries';
}

function renderSplitBar(split){
  if(!split) return '';
  const bar = split.map(([label,color,pct]) => `<div style="width:${pct}%; background:var(--${color});"></div>`).join('');
  const legend = split.map(([label,color,pct]) => `<span><i style="background:var(--${color})"></i>${label} ${pct}%</span>`).join('');
  return `<div class="split-bar">${bar}</div><div class="split-legend">${legend}</div>`;
}

const CATEGORY_LABELS = {
  all: 'Todas', A: 'A · Equilibrados', B: 'B · V-Taper/Superior', C: 'C · Peito',
  G: 'G · Misturados',
  D: 'D · Costas', E: 'E · Ombros', F: 'F · Braços', H: 'H · Pernas 2x',
  UTIL: '🚨 Emergência', EXP: '🧪 Experimentais'
};
let currentCategoryFilter = 'all';

function planMatchesFilter(planKey, filter){
  if(filter === 'all') return true;
  const p = PLANS[planKey];
  if(filter === 'EXP') return (p.tags||[]).includes('EXPERIMENTAL');
  return p.category === filter;
}

function renderCatFilter(){
  const wrap = document.getElementById('catFilter');
  wrap.innerHTML = '';
  const present = new Set(['all']);
  Object.keys(PLANS).forEach(pk=>{
    if(PLANS[pk].category) present.add(PLANS[pk].category);
    if((PLANS[pk].tags||[]).includes('EXPERIMENTAL')) present.add('EXP');
  });
  Object.keys(CATEGORY_LABELS).forEach(catKey=>{
    if(!present.has(catKey)) return;
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (catKey===currentCategoryFilter ? ' active' : '');
    btn.textContent = CATEGORY_LABELS[catKey];
    btn.addEventListener('click', ()=>{
      currentCategoryFilter = catKey;
      renderCatFilter();
      renderPlanSwitch();
      const visiblePlans = Object.keys(PLANS).filter(pk=>planMatchesCurrentFilters(pk));
      if(visiblePlans.length && !visiblePlans.includes(currentPlan)){
        selectPlan(visiblePlans[0]);
      }
    });
    wrap.appendChild(btn);
  });
}

let planSearchTerm = "";
function searchablePlanText(planKey){
  const p=PLANS[planKey]||{};
  const dayText = Object.values(p.days||{}).map(d=>[d.division,d.muscles].join(" "));
  return normSearch([p.label,p.desc,p.category,...(p.tags||[]),...(p.meta?Object.values(p.meta):[]),p.division,p.divisionMuscles,p.divisionDescription,...dayText].join(" "));
}
function planMatchesCurrentFilters(planKey){
  return planMatchesFilter(planKey,currentCategoryFilter) && (!planSearchTerm || searchablePlanText(planKey).includes(planSearchTerm));
}

function renderPlanSwitch(){
  const wrap = document.getElementById('planSwitch');
  wrap.innerHTML = '';
  const isEmergency = (k) => k === 'em' || k === 'em4';
  const isRecommended = (k) => k === 'rec';
  Object.keys(PLANS).filter(pk=>planMatchesCurrentFilters(pk)).forEach((planKey, i) => {
    const p = PLANS[planKey];
    const btn = document.createElement('button');
    btn.className = 'plan-btn' + (planKey===currentPlan ? ' active' : '') + (isEmergency(planKey) ? ' highlight' : '') + (isRecommended(planKey) ? ' recommended' : '');
    btn.dataset.plan = planKey;
    btn.innerHTML = `<span class="pname">${isEmergency(planKey) ? '🚨 ' : ''}${p.label}</span><span class="pdesc">${p.desc}</span>${p.division ? `<span class="pdiv" title="${p.division}">${p.division}</span>` : ''}`;
    btn.addEventListener('click', ()=> selectPlan(planKey));
    wrap.appendChild(btn);
  });
}

function isDayDoneToday(planKey, dayKey){
  const day = PLANS[planKey].days[dayKey];
  let totalSets = 0, doneSets = 0;
  day.groups.forEach(g=>{
    g.exercises.forEach((ex, ei)=>{
      const gi = day.groups.indexOf(g);
      const id = exId(planKey, dayKey, gi, ei);
      const total = setsCountFromScheme(ex.scheme);
      totalSets += total;
      const saved = progress.checks[id];
      if(saved && saved.date === todayStr()){
        doneSets += saved.sets.filter(Boolean).length;
      }
    });
  });
  return totalSets > 0 && doneSets === totalSets;
}

const WEEKDAY_KEY = ["dom","seg","ter","qua","qui","sex","sab"];
function todayKey(){ return WEEKDAY_KEY[new Date().getDay()]; }

function renderNav(planKey){
  const nav = document.getElementById('dayNav');
  nav.innerHTML = '';
  const days = PLANS[planKey].days;
  const today = todayKey();
  const activeDay = days[currentDay] ? currentDay : Object.keys(days)[0];
  Object.keys(days).forEach((dayKey)=>{
    const d = days[dayKey];
    const btn = document.createElement('button');
    btn.className = 'day-btn' + (dayKey===activeDay ? ' active' : '');
    btn.dataset.day = dayKey;
    const done = isDayDoneToday(planKey, dayKey);
    const isToday = dayKey === today;
    btn.innerHTML = `<span class="dot" style="background:var(--${d.color})"></span>${d.label}${done ? ' ✓' : ''}${isToday ? '<span class="today-tag">hoje</span>' : ''}`;
    btn.addEventListener('click', ()=> selectDay(planKey, dayKey));
    nav.appendChild(btn);
  });
}

function selectDay(planKey, dayKey){
  currentDay = dayKey;
  document.querySelectorAll('.day-btn').forEach(b=>b.classList.toggle('active', b.dataset.day===dayKey));
  document.querySelectorAll('.day-panel').forEach(p=>{
    const belongsToPlan = p.classList.contains('plan-'+planKey);
    const isThisDay = p.id === 'panel-'+planKey+'-'+dayKey;
    p.classList.toggle('active', belongsToPlan && isThisDay);
  });
  document.body.setAttribute('data-active', dayKey);
  progress.lastPlan = planKey;
  progress.lastDay = dayKey;
  saveProgress();
}

function computeWeeklySummary(planKey){
  const MUSCLE_MAP = {
    "Peito":"Peito", "Costas":"Costas", "Tríceps":"Tríceps", "Bíceps":"Bíceps",
    "Ombro":"Ombro", "Ombros":"Ombro", "Ombro lateral":"Ombro", "Ombro posterior":"Ombro",
    "Quadríceps":"Pernas", "Posterior":"Pernas", "Glúteos":"Pernas",
    "Panturrilhas":"Pernas", "Panturrilha":"Pernas", "Abdômen":"Abdômen",
  };
  const totals = {};
  const days = PLANS[planKey].days;
  Object.keys(days).forEach(dayKey=>{
    days[dayKey].groups.forEach(g=>{
      const base = g.name.split('—')[0].trim();
      const muscle = MUSCLE_MAP[base] || base;
      const sets = g.exercises.reduce((s,ex)=> s + setsCountFromScheme(ex.scheme), 0);
      totals[muscle] = (totals[muscle]||0) + sets;
    });
  });
  return totals;
}

function renderSummary(planKey){
  const panel = document.getElementById('summaryPanel');
  const totals = computeWeeklySummary(planKey);
  const max = Math.max(...Object.values(totals), 1);
  const order = ["Peito","Costas","Ombro","Bíceps","Tríceps","Pernas","Abdômen"];
  const keys = order.filter(k=>totals[k]!==undefined).concat(Object.keys(totals).filter(k=>!order.includes(k)));
  let html = `<h4>Séries por semana — ${PLANS[planKey].label}</h4>`;
  keys.forEach(k=>{
    const pct = Math.round((totals[k]/max)*100);
    html += `
      <div class="summary-row">
        <span class="sname">${k}</span>
        <div class="sbar-track"><div class="sbar-fill" style="width:${pct}%; background:var(--${PLANS[planKey].days[Object.keys(PLANS[planKey].days)[0]].color})"></div></div>
        <span class="sval">${totals[k]}</span>
      </div>`;
  });
  panel.innerHTML = html;
}

function dateKeyFromDate(d){

}

function collectProgressHistory(){
  const byDate = {};
  const exerciseKeys = Object.keys(progress.history || {});
  exerciseKeys.forEach(key=>{
    (progress.history[key] || []).forEach(entry=>{
      if(!entry || !entry.date) return;
      if(!byDate[entry.date]) byDate[entry.date]={sets:0,done:0,exercises:new Set()};
      byDate[entry.date].exercises.add(entry.exercise || key);
      (entry.sets || []).forEach(set=>{
        byDate[entry.date].sets++;
        if(set.done) byDate[entry.date].done++;
      });
    });
  });
  return {byDate, exerciseCount:exerciseKeys.filter(k=>(progress.history[k]||[]).length).length};
}

function renderProgressPanel(){
  const panel=document.getElementById('progressPanel');
  if(!panel) return;
  const {byDate,exerciseCount}=collectProgressHistory();
  const dates=Object.keys(byDate).sort((a,b)=>new Date(b)-new Date(a));
  const totalSets=dates.reduce((sum,d)=>sum+byDate[d].sets,0);
  const totalDone=dates.reduce((sum,d)=>sum+byDate[d].done,0);
  const recentDates=dates.slice(0,5);
  const now=new Date();
  const week=[];
  for(let i=6;i>=0;i--){
    const d=new Date(now); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    const key=dateKeyFromDate(d);
    week.push({key, label:d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.',''), count:byDate[key]?.done||0});
  }
  const max=Math.max(...week.map(x=>x.count),1);
  const recentHtml=recentDates.length ? recentDates.map(date=>{
    const x=byDate[date];
    return `<div class="progress-recent-item"><b>📅 ${date}</b><span>${x.done} séries concluídas · ${x.sets} séries registradas · ${x.exercises.size} exercício(s)</span></div>`;
  }).join('') : '<div class="history-empty">Ainda não há sessões registradas no histórico.</div>';
  panel.innerHTML=`
    <div class="progress-head"><div><div class="progress-title">📈 Meu progresso</div><div class="progress-sub">Resumo do que já foi registrado neste aparelho.</div></div></div>
    <div class="progress-stats">
      <div class="progress-stat"><b>${dates.length}</b><span>dias registrados</span></div>
      <div class="progress-stat"><b>${totalDone}</b><span>séries concluídas</span></div>
      <div class="progress-stat"><b>${totalSets}</b><span>séries registradas</span></div>
      <div class="progress-stat"><b>${exerciseCount}</b><span>exercícios com histórico</span></div>
    </div>
    <div class="progress-section"><h4>Últimos 7 dias</h4><div class="progress-days">${week.map(x=>`<div class="progress-day"><div class="progress-day-bar"><div class="progress-day-fill" style="height:${Math.max(4,Math.round((x.count/max)*100))}%"></div></div><div class="progress-day-label">${x.label}</div><div class="progress-day-count">${x.count}</div></div>`).join('')}</div></div>
    <div class="progress-section"><h4>Registros recentes</h4><div class="progress-recent">${recentHtml}</div></div>
    <div class="progress-actions">
      <button type="button" class="summary-btn progress-action" id="exportProgressBtn">📤 Exportar backup</button>
      <button type="button" class="summary-btn progress-action" id="importProgressBtn">📥 Importar backup</button>
    </div>
    <div class="progress-note">O backup é um arquivo JSON com seu andamento. Guarde uma cópia fora do navegador para conseguir restaurar os dados se trocar de aparelho ou limpar os dados do navegador.</div>`;
  panel.querySelector('#exportProgressBtn').addEventListener('click',exportProgress);
  panel.querySelector('#importProgressBtn').addEventListener('click',importProgress);
}

document.getElementById('progressBtn').addEventListener('click',()=>{
  const panel=document.getElementById('progressPanel');
  const willOpen=!panel.classList.contains('open');
  if(willOpen) renderProgressPanel();
  panel.classList.toggle('open',willOpen);
});

const EXPERIMENT_QUESTIONS = [
  ['carga', 'A carga está progredindo?'],
  ['reps', 'As repetições estão progredindo?'],
  ['execucao', 'A execução está boa?'],
  ['recuperacao', 'Você está recuperando bem entre as sessões?'],
  ['desconforto', 'Algum exercício está causando desconforto?'],
  ['sentindo', 'Você sente o músculo-alvo trabalhando?'],
  ['cansativo', 'O treino está ficando excessivamente cansativo?'],
  ['manter', 'Você quer manter essa estratégia?'],
];

function renderExperiment(planKey){
  const panel = document.getElementById('experimentPanel');
  const saved = progress.experiment[planKey] || {};
  let html = `<h4>🧪 Modo Experimento — ${PLANS[planKey].label}</h4>
    <p style="font-size:12px;opacity:.7;margin:-4px 0 10px">Marque o que se aplica agora. Isso fica salvo por plano, então você pode comparar como cada estratégia está indo ao longo do tempo.</p>`;
  EXPERIMENT_QUESTIONS.forEach(([qid, qtext])=>{
    const checked = saved[qid] ? 'checked' : '';
    html += `<label style="display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px;border-bottom:1px solid rgba(127,127,127,.15)">
      <input type="checkbox" data-qid="${qid}" ${checked} style="width:16px;height:16px;flex:0 0 auto">
      ${qtext}
    </label>`;
  });
  if(saved.updatedAt){
    html += `<p style="font-size:11px;opacity:.6;margin-top:8px">Última atualização: ${saved.updatedAt}</p>`;
  }
  panel.innerHTML = html;
  panel.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      if(!progress.experiment[planKey]) progress.experiment[planKey] = {};
      progress.experiment[planKey][cb.dataset.qid] = cb.checked;
      progress.experiment[planKey].updatedAt = todayStr();
      saveProgress();
    });
  });
}

document.getElementById('experimentBtn').addEventListener('click', ()=>{
  const panel = document.getElementById('experimentPanel');
  const willOpen = !panel.classList.contains('open');
  if(willOpen) renderExperiment(currentPlan);
  panel.classList.toggle('open', willOpen);
});

function selectPlan(planKey){
  renderStrategyPanel(planKey);
  currentPlan = planKey;
  document.querySelectorAll('.plan-btn').forEach(b=>b.classList.toggle('active', b.dataset.plan===planKey));
  renderNav(planKey);
  const firstDay = Object.keys(PLANS[planKey].days)[0];
  selectDay(planKey, firstDay);
  const panel = document.getElementById('summaryPanel');
  if(panel.classList.contains('open')) renderSummary(planKey);
  const expPanel = document.getElementById('experimentPanel');
  if(expPanel.classList.contains('open')) renderExperiment(planKey);
}

document.getElementById('planSearch').addEventListener('input',e=>{
  planSearchTerm=normSearch(e.target.value);
  renderPlanSwitch();
  if(document.getElementById('comparisonPanel').classList.contains('open')) renderComparison();
});
document.getElementById('compareBtn').addEventListener('click',()=>{
  const panel=document.getElementById('comparisonPanel');
  panel.classList.toggle('open');
  if(panel.classList.contains('open')) renderComparison();
});

async function init(){
  await loadProgress();
  renderCatFilter();
  renderPlanSwitch();
renderStrategyPanel(currentPlan);
  Object.keys(PLANS).forEach(planKey=>{
    Object.keys(PLANS[planKey].days).forEach(dayKey=> renderDay(planKey, dayKey));
  });
  const lastPlan = (progress.lastPlan && PLANS[progress.lastPlan]) ? progress.lastPlan : 'a';
  const lastDay = (progress.lastDay && PLANS[lastPlan].days[progress.lastDay]) ? progress.lastDay : Object.keys(PLANS[lastPlan].days)[0];
  currentPlan = lastPlan;
  renderStrategyPanel(lastPlan);
  document.querySelectorAll('.plan-btn').forEach(b=>b.classList.toggle('active', b.dataset.plan===lastPlan));
  renderNav(lastPlan);
  selectDay(lastPlan, lastDay);
}
init();
</script>

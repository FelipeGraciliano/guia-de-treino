<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Treino — Hipertrofia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-active="seg">

<header>
  <button id="themeToggle" class="theme-toggle" title="Alternar Modo Claro/Escuro">🌗</button>
  <p class="eyebrow">Programa de treino</p>
  <h1>Hipertrofia — 5 dias</h1>
  <p class="sub">Toque nos quadrados pra marcar as séries feitas</p>

  <!-- Navegação Principal Unificada -->
  <nav class="app-header-nav">
    <a href="index.html" class="app-nav-tab active">🏋️ Treinos</a>
    <a href="dieta.html" class="app-nav-tab">🥗 Dieta & Déficit</a>
  </nav>
</header>

<div class="cat-filter" id="catFilter"></div>

<div class="library-tools">
  <input id="planSearch" class="plan-search" type="search" placeholder="🔎 Buscar estratégia, foco ou divisão…" autocomplete="off">
</div>

<div class="plan-switch" id="planSwitch"></div>

<!-- Barra de Ações Rápidas (Organizada, sem empilhamento) -->
<div class="quick-toolbar">
  <button class="quick-btn" id="progressBtn" type="button">
    <span class="qbtn-icon">📈</span>
    <span class="qbtn-label">Meu Progresso</span>
  </button>
  <button class="quick-btn" id="summaryBtn" type="button">
    <span class="qbtn-icon">📊</span>
    <span class="qbtn-label">Resumo de Séries</span>
  </button>
  <button class="quick-btn" id="compareBtn" type="button">
    <span class="qbtn-icon">⚖️</span>
    <span class="qbtn-label">Comparar Planos</span>
  </button>
  <button class="quick-btn" id="experimentBtn" type="button">
    <span class="qbtn-icon">🧪</span>
    <span class="qbtn-label">Modo Experimento</span>
  </button>
  <button class="quick-btn" id="techGlossaryBtn" type="button">
    <span class="qbtn-icon">🔥</span>
    <span class="qbtn-label">Técnicas Avançadas</span>
  </button>
  <a href="dieta.html" class="quick-btn quick-diet-btn">
    <span class="qbtn-icon">🥗</span>
    <span class="qbtn-label">Dieta & Déficit →</span>
  </a>
</div>

<!-- Painel de Estratégia do Plano Atual (Colapsável & Limpo) -->
<div class="strategy-panel" id="strategyPanel"></div>

<!-- Navegação dos Dias da Semana -->
<nav class="days" id="dayNav"></nav>

<!-- Exercícios do Dia Selecionado -->
<main id="dayContainer"></main>

<!-- MODAL OVERLAY FLUIDO (Progresso, Séries, Comparador, Experimento) -->
<div class="app-modal-overlay" id="appModalOverlay" aria-hidden="true">
  <div class="app-modal-card" id="appModalCard" role="dialog" aria-modal="true">
    <div class="app-modal-header">
      <div class="app-modal-title-group">
        <span class="app-modal-badge" id="appModalBadge">PAINEL</span>
        <h3 class="app-modal-title" id="appModalTitle">Meu Progresso</h3>
      </div>
      <button class="app-modal-close-btn" id="appModalClose" type="button" aria-label="Fechar modal" title="Fechar (Esc)">✕ Fechar</button>
    </div>
    <div class="app-modal-body" id="appModalBody">
      <!-- Conteúdo dinâmico injetado aqui sem empilhar na página -->
    </div>
  </div>
</div>

<script src="js/plans.js"></script>
<script src="js/app.js"></script>
</body>
</html>
